<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimentação Patrimonial — TI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%2314708E'/><path d='M20 7 12 3 4 7v10l8 4 8-4V7z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- ===== Menu lateral ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7 12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4"/><path d="M12 11v10"/></svg>
        </span>
        <div>
          <div class="name">Patrimônio TI</div>
          <div class="sub">Movimentação de ativos</div>
        </div>
      </div>
      <nav class="sidebar__nav" id="sidebarNav"><!-- itens gerados via JS --></nav>
      <div class="sidebar__foot">FSPH · Assessoria de TI</div>
    </aside>
    <div class="side-overlay"></div>

    <!-- ===== Área principal ===== -->
    <div class="main">
      <header class="topbar">
        <button class="burger" id="burger" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 class="topbar__title">Painel</h1>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <button class="btn btn-outline-soft btn-sm" id="btnImportar" title="Importar JSON">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg><span>Importar</span>
          </button>
          <button class="btn btn-brand btn-sm" id="btnBackup" title="Gerar backup">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg><span>Backup</span>
          </button>
        </div>
      </header>

      <main class="content">
        <div id="view"><!-- conteúdo renderizado via JS --></div>
      </main>
    </div>
  </div>

  <!-- ===== Modal reutilizável (formulários) ===== -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-brand" id="modalConfirm">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Área de impressão (documento formal, só aparece ao imprimir) ===== -->
  <div id="printArea" class="print-only"></div>

  <!-- ===== Bibliotecas (locais, sem CDN) ===== -->
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/sweetalert2.all.min.js"></script>

  <!-- ===== Aplicação ===== -->
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/equipamentos.js"></script>
  <script src="js/movimentacoes.js"></script>
</body>
</html>
